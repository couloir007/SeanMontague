trail_mapper_planner.settings:
  type: config_object
  label: 'Trail Mapper Planner settings'
  mapping:
    areas:
      type: sequence
      label: 'Planner areas'
      sequence:
        type: mapping
        label: 'Area'
        mapping:
          path:
            type: string
            label: 'URL path prefix (no slashes)'
          label:
            type: label
            label: 'Area label'
          center:
            type: sequence
            label: 'Map centre [lat, lon]'
            sequence:
              type: float
              label: 'Coordinate'
          zoom:
            type: integer
            label: 'Initial zoom'
