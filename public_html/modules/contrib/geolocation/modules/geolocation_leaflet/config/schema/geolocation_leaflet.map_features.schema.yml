  label: 'Control Scale'
  mapping:
    settings:
      type: mapping
      label: 'Settings'
      mapping:
        metric:
          type: boolean
          label: 'Metric'
        imperial:
          type: boolean
          label: 'Imperial'

plugin.plugin_configuration.geolocation.map_feature.leaflet_max_bounds:
