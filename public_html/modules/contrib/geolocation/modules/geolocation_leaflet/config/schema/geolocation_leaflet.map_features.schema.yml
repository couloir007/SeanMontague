  label: 'Max Bounds'
  mapping:
    settings:
      type: mapping
      label: 'Settings'
      mapping:
        north:
          type: float
          label: 'North'
        south:
          type: float
          label: 'South'
        east:
          type: float
          label: 'East'
        west:
          type: float
          label: 'West'

plugin.plugin_configuration.geolocation.map_feature.leaflet_wms:
