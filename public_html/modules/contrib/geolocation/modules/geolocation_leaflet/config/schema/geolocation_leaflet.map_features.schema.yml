      mapping:
        url:
          type: string
          label: 'Url'
        version:
          type: string
          label: 'Version'
        layers:
          type: string
          label: 'Layers'
        styles:
          type: string
          label: 'Styles'
        srs:
          type: string
          label: 'SRS'
        format:
          type: string
          label: 'Format'
        transparent:
          type: boolean
          label: 'Transparent'
        identify:
          type: boolean
          label: 'Identify'

plugin.plugin_configuration.geolocation.map_feature.leaflet_rotate:
