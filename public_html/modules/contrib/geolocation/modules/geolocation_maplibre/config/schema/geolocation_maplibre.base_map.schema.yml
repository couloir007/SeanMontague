      type: string
      label: 'Mapbox Studio style'
    access_token:
      type: string
      label: 'Access token'
    use_current_language:
      type: boolean
      label: 'Use current user language'

plugin.plugin_configuration.geolocation_maplibre.base_map.custom:
  type: mapping
  label: 'Custom'
  mapping:
    style_url:
