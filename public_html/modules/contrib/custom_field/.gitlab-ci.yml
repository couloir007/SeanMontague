include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  _TARGET_PHP: 8.3
  OPT_IN_TEST_CURRENT: 1
  OPT_IN_TEST_PREVIOUS_MAJOR: 1
  OPT_IN_TEST_PREVIOUS_MINOR: 0
  OPT_IN_TEST_NEXT_MINOR: 0
  OPT_IN_TEST_NEXT_MAJOR: 0
  OPT_IN_TEST_MAX_PHP: 1
  _PHPUNIT_CONCURRENT: 1
  _CSPELL_IGNORE_PATHS: "'css'"

# 'Abuse' previous minor to test against D10.3 (LTS).
composer (previous minor):
  variables:
    DRUPAL_CORE: 10.3.14

# Respect our own composer.json cap (<11.4) instead of always installing
# the latest stable core.
composer:
  variables:
    IGNORE_PROJECT_DRUPAL_CORE_VERSION: 0

composer (max PHP version):
  variables:
    IGNORE_PROJECT_DRUPAL_CORE_VERSION: 0

# ==================== MkDocs Documentation ====================

mkdocs:
  stage: test
  image: python:3.12-alpine
  rules:
    - changes:
        - mkdocs.yml
        - docs/**/*
      when: on_success
    - when: never
  script:
    - pip install mkdocs mkdocs-material
    - mkdocs build --strict

pages:
  stage: .post
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_REF_NAME !~ /^[0-9]+\.[0-9]+\.x$/'
      when: never
    - changes:
        - mkdocs.yml
        - docs/**/*
      when: on_success
    - when: never
  script:
    - pip install mkdocs-material
    - mkdocs build --site-dir public
  artifacts:
    paths:
      - public

cspell:
  allow_failure: true
phpcs:
  allow_failure: true
phpstan:
  allow_failure: true
