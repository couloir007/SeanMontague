site_name: Custom Field
site_author: Andy Marquis
repo_url: https://git.drupalcode.org/project/custom_field
repo_name: drupal/custom_field
site_dir: site
docs_dir: docs
exclude_docs: |
  snippets/
theme:
  name: material
  font:
    code: Roboto Mono
    #text: default
  palette:
    # See https://squidfunk.github.io/mkdocs-material/setup/changing-the-colors/
    primary: indigo
    scheme: default
    accent: deep purple
  features:
    - content.code.copy
    - content.code.select
    - content.action.edit
    #- navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.tracking
    - navigation.footer
    - navigation.edit
    - content.tooltips
dev_addr: '0.0.0.0:8000'
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - codehilite:
      linenums: true
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list
  - pymdownx.blocks.admonition
  - pymdownx.blocks.details
  - pymdownx.emoji:
      # eslint-disable-next-line yml/no-empty-mapping-value
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      # eslint-disable-next-line yml/no-empty-mapping-value
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      linenums: true
      extend_pygments_lang:
        - name: php
          lang: php
          options:
            startinline: true
  - pymdownx.inlinehilite
  - pymdownx.quotes:
      callouts: true
  - pymdownx.snippets:
      base_path: docs/snippets
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          # eslint-disable-next-line yml/no-empty-mapping-value
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: "#"

extra:
  generator: false
  social:
    - icon: fontawesome/brands/gitlab
      link: https://git.drupalcode.org/project/custom_field
    - icon: fontawesome/brands/slack
      link: https://drupal.slack.com/archives/C09312M6Y4A
