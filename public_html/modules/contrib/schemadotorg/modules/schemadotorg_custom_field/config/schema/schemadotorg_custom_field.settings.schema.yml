schemadotorg_custom_field.settings:
  type: config_object
  label: 'Schema.org Custom field settings'
  mapping:
    default_schema_properties:
      type: sequence
      label: 'Schema.org default properties'
      sequence:
        type: mapping
        label: 'Schema.org default property'
        mapping:
          schema_type:
            type: string
            label: 'Schema.org type'
          schema_role:
            type: string
            label: 'Schema.org role'
          schema_properties:
            type: sequence
            label: 'Schema.org properties'
            sequence:
              type: mapping
              label: 'Schema.org property'
              mapping:
                data_type:
                  type: string
                  label: 'Data type'
                widget_type:
                  type: string
                  label: 'Widget type'
                formatter_type:
                  type: string
                  label: 'Formatter type'
                name:
                  type: string
                  label: Name
                label:
                  type: text
                  label: Label
                allowed_values:
                  type: sequence
                  label: 'Allowed values'
                  sequence:
                    type: text
                    label: 'Allowed value'
                # @see custom_field.column
                length:
                  type: integer
                  label: 'Length'
                unsigned:
                  type: boolean
                  label: 'Unsigned'
                precision:
                  type: integer
                  label: 'Precision'
                scale:
                  type: integer
                  label: 'Scale'
                size:
                  type: string
                  label: 'Size'
                datetime_type:
                  type: string
                  label: 'Date type'
                target_type:
                  type: string
                  label: 'Type of item to reference'
                uri_scheme:
                  type: string
                  label: 'Upload destination'
                # @see custom_field.field.*:
                weight:
                  type: integer
                  label: 'Weight'
                type:
                  type: string
                  label: 'Type'
                placeholder:
                  type: label
                  label: 'Placeholder'
                maxlength:
                  type: integer
                  label: 'Max length'
                maxlength_js:
                  type: boolean
                  label: 'Show max length character count'
                # ImageWidget.
                preview_image_style:
                  type: string
                  label: 'Preview image style'
                progress_indicator:
                  type: string
                  label: 'Progress indicator'
                # TextareaWidget.
                rows:
                  type: integer
                  label: 'Rows'
                # MapKeyValueWidget.
                key_label:
                  type: label
                  label: 'Key label'
                value_label:
                  type: label
                  label: 'Value label'
                # LinkWidget|LinkitWidget.
                placeholder_url:
                  type: string
                  label: 'Placeholder for URL'
                placeholder_title:
                  type: label
                  label: 'Placeholder for link text'
                # EntityReferenceAutocompleteWidget.
                match_operator:
                  type: string
                  label: 'Match operator'
                match_limit:
                  type: integer
                  label: 'Match limit'
                # EntityReferenceRadiosWidget|EntityReferenceSelectWidget|RadiosWidget|SelectWidget|ViewfieldSelectWidget.
                empty_option:
                  type: string
                  label: 'Empty option'
                # HierarchicalSelectWidget.
                force_deepest_level:
                  type: boolean
                  label: 'Force deepest level'
                level_labels:
                  type: boolean
                  label: 'Show level labels'
                # ColorBoxesWidget.
                default_colors:
                  type: string
                  label: 'Default colors'
                # DateTimeDatelistWidget.
                date_order:
                  type: string
                  label: 'Date part order'
                time_type:
                  type: string
                  label: 'Time type'
                increment:
                  type: integer
                  label: 'increment'
                # @see custom_field.field_settings.*
                check_empty:
                  type: boolean
                  label: 'Check empty?'
                required:
                  type: boolean
                  label: 'Required'
                translatable:
                  type: boolean
                  label: 'Users may translate this field'
                description:
                  type: text
                  label: 'Help text'
                description_display:
                  type: string
                  label: 'Help text position'
                # string|integer|float|decimal subfields.
                prefix:
                  type: label
                  label: 'Prefix'
                suffix:
                  type: label
                  label: 'Suffix'
                # file|image subfields.
                file_directory:
                  type: string
                  label: 'File directory'
                file_extensions:
                  type: string
                  label: 'Allowed file extensions'
                max_filesize:
                  type: string
                  label: 'Maximum upload size'
                # image subfields.
                max_resolution:
                  type: string
                  label: 'Maximum image resolution'
                min_resolution:
                  type: string
                  label: 'Minimum image resolution'
                alt_field:
                  type: boolean
                  label: 'Enable Alt field'
                alt_field_required:
                  type: boolean
                  label: 'Alt field required'
                title_field:
                  type: boolean
                  label: 'Enable Title field'
                title_field_required:
                  type: boolean
                  label: 'Title field required'
                # map|map_string subfields.
                table_empty:
                  type: string
                  label: 'Empty text'
                # integer|float|decimal subfields.
                min:
                  type: integer
                  label: 'Minimum'
                max:
                  type: integer
                  label: 'Maximum'
                # telephone subfields.
                pattern:
                  type: string
                  label: 'Telephone format'
                # uri|link subfields.
                link_type:
                  type: integer
                  label: 'Allowed link type'
                field_prefix:
                  type: string
                  label: 'Field prefix'
                field_prefix_custom:
                  type: string
                  label: 'Custom field prefix'
                # link subfields.
                title:
                  type: integer
                  label: 'Allow link text'
                enabled_attributes:
                  type: sequence
                  sequence:
                    type: boolean
                    label: 'Enabled'
                widget_default_open:
                  type: string
                  label: 'Widget expand behavior'
                # time subfields.
                seconds_enabled:
                  type: boolean
                  label: 'Add seconds parameter to input widget'
                seconds_step:
                  type: integer
                  label: 'Step to change seconds'
                # string_long subfields.
                formatted:
                  type: boolean
                  label: 'Enable wysiwyg'
                default_format:
                  type: string
                  label: 'Default format'
                format:
                  type: mapping
                  label: 'Format settings'
                  mapping:
                    guidelines:
                      type: boolean
                      label: 'Show format guidelines'
                    help:
                      type: boolean
                      label: 'Show format help'
                # datetime subfields.
                timezone_enabled:
                  type: boolean
                  label: 'Enable time zone selection'
                timezone_options:
                  type: sequence
                  label: 'Time zone options'
                  sequence:
                    type: string
                    label: 'Time zone'
                # entity_reference subfields.
                handler:
                  type: string
                  label: 'Handler'
                handler_settings:
                  type: mapping
                  label: 'Handler settings'
                  mapping:
                    include_anonymous:
                      type: boolean
                      label: 'Include anonymous'
                    filter:
                      type: mapping
                      label: 'Filter'
                      mapping:
                        type:
                          type: string
                          label: 'Type'
                    sort:
                      type: mapping
                      label: 'Sort'
                      mapping:
                        field:
                          type: string
                          label: 'Sort by'
                        direction:
                          type: string
                          label: 'Sort direction'
                    auto_create:
                      type: boolean
                      label: "Create referenced entities if they don't already exist"
                    target_bundles:
                      type: sequence
                      label: 'Target bundles'
                      sequence:
                        type: string
                        label: 'Bundle'
                    auto_create_bundle:
                      type: string
                      label: 'Store new items in'
                    view:
                      type: mapping
                      label: 'View used to select the entities'
                      mapping:
                        view_name:
                          type: string
                          label: 'View machine name'
                        display_name:
                          type: string
                          label: 'View display name'
                        arguments:
                          type: sequence
                          label: 'View arguments'
                          sequence:
                            type: custom_field.view_arguments.[%key]
          widget_id:
            type: string
            label: 'Widget ID'
          widget_settings:
            type: ignore
            label: 'Widget settings'
          formatter_id:
            type: string
            label: 'Formatter ID'
          formatter_settings:
            type: ignore
            label: 'Formatter settings'
    default_format:
      type: string
      label: 'Default format'
