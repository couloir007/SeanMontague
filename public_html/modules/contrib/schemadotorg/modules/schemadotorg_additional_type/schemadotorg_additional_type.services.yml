services:
  _defaults:
    autowire: true
    autoconfigure: true

  schemadotorg_additional_type.manager:
    class: Drupal\schemadotorg_additional_type\SchemaDotOrgAdditionalTypeManager
  Drupal\schemadotorg_additional_type\SchemaDotOrgAdditionalTypeManagerInterface: '@schemadotorg_additional_type.manager'

  schemadotorg_additional_type.base_field_manager:
    class: Drupal\schemadotorg_additional_type\SchemaDotOrgAdditionalTypeBaseFieldManager
  Drupal\schemadotorg_additional_type\SchemaDotOrgAdditionalTypeBaseFieldManagerInterface: '@schemadotorg_additional_type.base_field_manager'

  schemadotorg_additional_type.field_access_handler:
    class: Drupal\schemadotorg_additional_type\SchemaDotOrgAdditionalTypeFieldAccessHandler
  Drupal\schemadotorg_additional_type\SchemaDotOrgAdditionalTypeFieldAccessHandlerInterface: '@schemadotorg_additional_type.field_access_handler'

  schemadotorg_additional_type.jsonld_manager:
    class: Drupal\schemadotorg_additional_type\SchemaDotOrgAdditionalTypeJsonLdManager
  Drupal\schemadotorg_additional_type\SchemaDotOrgAdditionalTypeJsonLdManagerInterface: '@schemadotorg_additional_type.jsonld_manager'

  schemadotorg_additional_type.event_subscriber:
    class: Drupal\schemadotorg_additional_type\EventSubscriber\SchemaDotOrgAdditionalTypeEventSubscriber
    arguments: ['@current_route_match', '@entity_type.manager', '@config.storage.sync', '@config.storage.snapshot', '@schemadotorg_additional_type.base_field_manager']

  schemadotorg_additional_type.controller.entity_form:
    # Override the entity form controller to handle the node entity's
    # additional type add and edit operation.
    decorates: controller.entity_form
    class: Drupal\schemadotorg_additional_type\Controller\SchemaDotOrgAdditionalTypeHtmlEntityFormController
    public: false
